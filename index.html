<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d090c"><title>Veya</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d090c;min-width:0;color:#eee7eb;font-family:Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;width:100%;max-width:480px;margin:auto;background:radial-gradient(circle at 80% 0,#3a1520 0,#180d12 28%,#0d090c 65%);min-height:100vh}.top{height:68px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid #ffffff12;background:#0d090cf0;position:sticky;top:0;z-index:5}.brand{display:flex;gap:10px;align-items:center;font-size:23px;letter-spacing:.14em}.v{width:32px;height:32px;border:1px solid #c08497;border-radius:9px;display:grid;place-items:center;color:#e1acbd;font-family:serif;font-style:italic}.page{padding:30px 20px 100px}.ey{color:#c08497;font-size:11px;letter-spacing:.18em;font-weight:700}.title{font-family:Georgia,serif;font-weight:500;font-size:42px;line-height:1.05;margin:12px 0 28px}.title em{color:#cf93a5}.empty,.card,.panel{border:1px solid #ffffff10;background:#ffffff05;border-radius:22px}.empty{text-align:center;padding:42px 25px}.heart{width:58px;height:58px;margin:auto;border-radius:18px;background:#67263b;display:grid;place-items:center;color:#e8afc0;font-size:25px}.empty h2{font-family:Georgia,serif;margin:18px 0 8px}.muted{color:#a3979d;line-height:1.6}.primary,.secondary,.danger,.upload{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;padding:12px 17px;border:1px solid #ffffff12}.primary{background:#702b40;color:white}.secondary{background:#ffffff08;color:#ddd}.danger{background:#32151e;color:#d79eab;border-color:#6b2b3d}.full{width:100%;margin-top:18px}.list{display:flex;flex-direction:column;gap:10px}.char{display:grid;grid-template-columns:50px 1fr auto;gap:13px;align-items:center;text-align:left;padding:13px;background:#ffffff05;border:1px solid #ffffff0c;border-radius:18px;color:#eee}.char small,.sub{display:block;color:#998d94;font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.avatar{width:50px;height:50px;border-radius:16px;background:linear-gradient(145deg,#713047,#29131d);display:grid;place-items:center;color:#e6b9c7;font:20px Georgia,serif;object-fit:cover}.avatar.big{width:86px;height:86px;border-radius:23px;font-size:32px}.form{display:flex;flex-direction:column;gap:16px}.form label{color:#cfc2c8;font-size:13px}.form input,.form textarea{width:100%;margin-top:7px;background:#ffffff07;border:1px solid #ffffff14;border-radius:14px;color:#eee;padding:12px 13px;outline:none}.form textarea{min-height:92px;resize:vertical}.form textarea.big{min-height:155px}.back{border:0;background:none;color:#aa9da4;padding:0;display:flex;gap:7px;align-items:center;margin-bottom:22px}.uploadRow{display:flex;align-items:center;gap:14px;margin-top:8px}.upload{background:#34202d;color:#e9c6d0;border-color:#71445c}.upload input{display:none}.note,.setting{display:flex;gap:12px;padding:15px;border-radius:17px;background:#ffffff05;border:1px solid #ffffff0c;color:#b8abb1;line-height:1.5;font-size:13px}.setting{align-items:flex-start}.setting b{color:#eee;display:block;margin-bottom:4px}.profile{padding:18px}.profileHead{display:flex;gap:13px;align-items:center;margin-bottom:18px}.profileHead b{display:block;font-size:18px}.profileHead span{color:#968b91;font-size:12px}.nav{position:fixed;left:0;right:0;bottom:0;background:#171117f5;border-top:1px solid #3a2834;display:flex;z-index:20;padding:8px 8px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.nav button{flex:1;border:0;background:none;color:#a99ba4;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}.nav button.on{color:#e0a2b5}.chat{height:calc(100vh - 68px);display:flex;flex-direction:column}.chatHead{height:64px;padding:0 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ffffff10}.chatHead .back{margin:0}.chatId{flex:1;display:flex;align-items:center;gap:9px}.chatId b{display:block}.chatId span{display:block;color:#93878d;font-size:11px;margin-top:2px}.actions{display:flex;gap:4px}.messages{flex:1;overflow:auto;padding:18px 15px 160px}.msg{display:flex;gap:8px;margin:12px 0}.msg.user{flex-direction:row-reverse}.bubble{max-width:80%;padding:10px 12px;border-radius:16px;line-height:1.48;font-size:14px;background:#ffffff08;border:1px solid #ffffff0c}.msg.user .bubble{background:#6a2a3e;border:0}.msg small{color:#8f838a;font-size:10px;display:block;margin-top:3px}.compose{position:fixed;bottom:68px;left:0;right:0;max-width:480px;margin:auto;background:#0d090cf7;border-top:1px solid #ffffff10;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:19}.compose input{flex:1;background:#ffffff08;border:1px solid #ffffff14;border-radius:14px;color:#fff;padding:12px;outline:0}.send{width:45px;border:0;border-radius:14px;background:#702b40;color:#fff}.msgTools{position:relative;display:flex;justify-content:flex-end}.msgMenuBtn{background:none;border:0;color:#9d9097;font-size:20px;line-height:1;padding:1px 5px}.msgMenu{position:absolute;right:0;top:24px;display:none;min-width:105px;padding:5px;background:#21171d;border:1px solid #ffffff18;border-radius:10px;box-shadow:0 10px 25px #0009;z-index:30}.msgMenu.show{display:block}.msgMenu button{display:block;width:100%;text-align:left;background:none;border:0;color:#eee;padding:8px 9px;font-size:12px;border-radius:7px}.msgMenu button:hover{background:#ffffff0d}.hidden{display:none}@media(min-width:481px){body{background:#080608}.app{box-shadow:0 0 50px #000;min-height:100vh}.nav,.compose{left:50%;right:auto;transform:translateX(-50%);width:480px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="v">V</div><span>veya</span></div></header><div id="root"></div></div><script>
const C='veya.chars.v3',P='veya.profile.v2',S='veya.screen';const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}};const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let chars=read(C,[]),profile=read(P,{name:'',bio:'',avatar:''}),screen=localStorage.getItem(S)||'chats',sel=null;const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);const root=document.getElementById('root');
function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function avatar(c,big=false){return c.avatar?`<img class="avatar ${big?'big':''}" src="${c.avatar}">`:`<div class="avatar ${big?'big':''}">${esc(c.name||'Y')[0]||'Y'}</div>`}function fileData(input,cb){const f=input.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)}
function nav(){return `<nav class="nav"><button class="${screen==='chats'?'on':''}" onclick="go('chats')">💬<span>Chats</span></button><button class="${screen==='create'?'on':''}" onclick="go('create')">＋<span>Create</span></button><button class="${screen==='settings'?'on':''}" onclick="go('settings')">⚙<span>Settings</span></button></nav>`}
function go(s){screen=s;localStorage.setItem(S,s);render()}function render(){if(screen==='chat'&&sel)return chat(chars.find(c=>c.id===sel));if(screen==='create')return create();if(screen==='settings')return settings();return chats()}
function chats(){root.innerHTML=`<main class="page"><div class="ey">YOUR SPACE</div><h1 class="title">Your <em>chats.</em></h1>${chars.length?`<div class="list">${chars.map(c=>`<button class="char" onclick="openChat('${c.id}')">${avatar(c)}<div><b>${esc(c.name)}</b><small>${c.messages?.length||0} messages · ${esc(c.description||'No description yet.')}</small></div><span>›</span></button>`).join('')}</div>`:`<section class="empty"><div class="heart">♡</div><h2>Your world is empty</h2><p class="muted">No characters yet. Create your first character and make them yours.</p><button class="primary" onclick="go('create')">＋ Create Character</button></section>`}</main>${nav()}`}
function create(){root.innerHTML=`<main class="page"><button class="back" onclick="go('chats')">← Back</button><div class="ey">NEW CHARACTER</div><h1 class="title">Make them <em>yours.</em></h1><form id="createForm" class="form" onsubmit="event.preventDefault();newCharFromForm()"><label>AI profile picture<div class="uploadRow"><div id="prev"><div class="avatar">Y</div></div><label class="upload">＋ Choose image<input id="newAvatar" type="file" accept="image/*" onchange="pickNewAvatar(this)"></label></div></label><label>Name<input id="newName" required placeholder="Their name"></label><label>Short description<textarea id="newDescription" placeholder="A short bio or introduction..."></textarea></label><label>Story / background<textarea id="newStory" class="big" placeholder="Their story, past, relationships, world, and anything important you want the AI to remember..."></textarea></label><label>Relationship with you<textarea id="newRelationship" placeholder="How you know each other, current dynamic, boundaries, development..."></textarea></label><label>Relationship dynamics<textarea id="newDynamics" placeholder="Tension, affection, jealousy, trust, pace of closeness..."></textarea></label><label>Important details<textarea id="newDetails" class="big" placeholder="Anything important the character should remember..."></textarea></label><label>First greeting<textarea id="newGreeting" placeholder="What they say when the conversation begins..."></textarea></label><div class="note">♡ <span>Veya chooses affectionate nicknames naturally from context, mood, and relationship development.</span></div><button class="primary full" type="submit">Create Character ✦</button></form></main>${nav()}`}
window.newAvatarData='';
function compressImage(file,cb){const r=new FileReader();r.onload=function(){const img=new Image();img.onload=function(){const max=512;let w=img.width,h=img.height;if(w>max||h>max){const scale=Math.min(max/w,max/h);w=Math.round(w*scale);h=Math.round(h*scale)}const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);cb(cv.toDataURL('image/jpeg',0.78))};img.src=r.result};r.readAsDataURL(file)}
function pickNewAvatar(input){const f=input.files&&input.files[0];if(!f)return;compressImage(f,function(data){window.newAvatarData=data;document.getElementById('prev').innerHTML='<img class="avatar big" src="'+data+'">'})}
function newCharFromForm(){const name=document.getElementById('newName').value.trim();if(!name)return;const c={id:id(),name:name,description:document.getElementById('newDescription').value.trim(),story:document.getElementById('newStory').value.trim(),relationship:document.getElementById('newRelationship').value.trim(),dynamics:document.getElementById('newDynamics').value.trim(),details:document.getElementById('newDetails').value.trim(),greeting:document.getElementById('newGreeting').value.trim(),avatar:window.newAvatarData||'',memory:[],messages:[]};if(c.greeting)c.messages.push({id:id(),role:'ai',text:c.greeting});chars.unshift(c);try{save(C,chars)}catch(e){chars.shift();alert('الصورة كبيرة جداً. اختاري صورة أصغر وحاولي مرة ثانية.');return}sel=c.id;screen='chat';render()}
function newChar(d){return newCharFromForm()}
function openChat(i){sel=i;screen='chat';render()}function update(c,p){Object.assign(c,p);save(C,chars)}
function chat(c){if(!c)return go('chats');root.innerHTML=`<main class="chat"><div class="chatHead"><button class="back" onclick="go('chats')">←</button><div class="chatId">${avatar(c)}<div><b>${esc(c.name)}</b><span>AI companion</span></div></div><div class="actions"><button class="back" onclick="charSettings('${c.id}')">⚙</button><button class="back" onclick="delChat('${c.id}')">🗑</button></div></div><div class="messages" id="msgs">${c.messages?.length?c.messages.map(m=>`<div class="msg ${m.role}">${avatar(m.role==='ai'?c:{name:'You',avatar:''})}<div><div class="bubble">${esc(m.text)}</div><div class="msgTools"><button class="msgMenuBtn" onclick="toggleMsgMenu(event,'${m.id}')">⋯</button><div class="msgMenu" id="menu-${m.id}"><button onclick="editMsg('${c.id}','${m.id}')">✏️ Edit</button><button onclick="deleteMsg('${c.id}','${m.id}')">🗑️ Delete</button></div></div></div></div>`).join(''):`<div class="empty"><h2>${esc(c.name)}</h2><p class="muted">${esc(c.description||'Your conversation starts here.')}</p></div>`}</div><div class="compose"><input id="input" placeholder="Write a message…" onkeydown="if(event.key==='Enter')sendMsg('${c.id}')"><button class="send" onclick="sendMsg('${c.id}')">➤</button></div></main>`;setTimeout(()=>{const x=document.getElementById('msgs');if(x)x.scrollTop=x.scrollHeight},0)}
async function sendMsg(cid){const c=chars.find(x=>x.id===cid),i=document.getElementById('input'),t=i?.value.trim();if(!c||!t)return;c.messages=c.messages||[];c.messages.push({id:id(),role:'user',text:t});i.value='';save(C,chars);render();try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({character:c,message:t,history:c.messages.slice(-20,-1),style:'natural-character-roleplay'})});const j=await r.json();if(!r.ok)throw Error(j.error||'AI error');c.messages.push({id:id(),role:'ai',text:j.reply||'I’m here.'})}catch(e){c.messages.push({id:id(),role:'ai',text:'AI error: '+(e?.message||'Unknown error')})}save(C,chars);render()}
function toggleMsgMenu(e,mid){e.stopPropagation();document.querySelectorAll('.msgMenu.show').forEach(x=>x.classList.remove('show'));const x=document.getElementById('menu-'+mid);if(x)x.classList.toggle('show')}document.addEventListener('click',()=>document.querySelectorAll('.msgMenu.show').forEach(x=>x.classList.remove('show')));function editMsg(cid,mid){const c=chars.find(x=>x.id===cid),m=c.messages.find(x=>x.id===mid),v=prompt('Edit message',m?.text||'');if(v&&v.trim()){m.text=v.trim();c.messages=c.messages.slice(0,c.messages.indexOf(m)+1);save(C,chars);render()}}function deleteMsg(cid,mid){const c=chars.find(x=>x.id===cid);c.messages=c.messages.filter(m=>m.id!==mid);save(C,chars);render()}function delChat(cid){if(confirm('Delete this entire conversation?')){const c=chars.find(x=>x.id===cid);if(c)c.messages=[];save(C,chars);render()}}
function charSettings(cid){const c=chars.find(x=>x.id===cid);if(!c)return;window.activeChar=c;root.innerHTML=`<main class="page"><button class="back" onclick="openChat('${c.id}')">← Back</button><div class="profileHead">${avatar(c,true)}<div><b>${esc(c.name)}</b><span>Character settings</span></div></div><form class="form" onsubmit="event.preventDefault();saveCharEdit('${c.id}')"><label>AI profile picture<div class="uploadRow"><div id="cp">${avatar(c)}</div><label class="upload">＋ Change image<input type="file" accept="image/*" onchange="pickCharAvatar(this)"></label></div></label><label>Name<input id="cn" value="${esc(c.name)}"></label><label>Short description<textarea id="cd">${esc(c.description)}</textarea></label><label>Story / background<textarea class="big" id="cs">${esc(c.story)}</textarea></label><label>Relationship with you<textarea id="cr">${esc(c.relationship||'')}</textarea></label><label>Relationship dynamics<textarea id="cdyn">${esc(c.dynamics||'')}</textarea></label><label>Important details<textarea class="big" id="cde">${esc(c.details||'')}</textarea></label><div class="setting"><b>Memory</b><span>${c.memory?.length||0} saved memories for this character.</span></div><button class="primary full">Save Changes</button><button type="button" class="danger full" onclick="deleteChar('${c.id}')">Delete Character</button></form></main>`}
function pickCharAvatar(input){const f=input.files&&input.files[0],c=window.activeChar;if(!f||!c)return;compressImage(f,function(data){c.avatar=data;document.getElementById('cp').innerHTML=avatar(c)})}
function saveCharEdit(cid){const c=chars.find(x=>x.id===cid);c.name=document.getElementById('cn').value.trim()||c.name;c.description=document.getElementById('cd').value;c.story=document.getElementById('cs').value;c.relationship=document.getElementById('cr').value;c.dynamics=document.getElementById('cdyn').value;c.details=document.getElementById('cde').value;try{save(C,chars)}catch(e){alert('الصورة كبيرة جداً. اختاري صورة أصغر.');return}openChat(cid)}
function deleteChar(cid){if(confirm('Delete this character and its chat?')){chars=chars.filter(c=>c.id!==cid);save(C,chars);sel=null;go('chats')}}
function settings(){root.innerHTML=`<main class="page"><div class="ey">VEYA SETTINGS</div><h1 class="title">Settings</h1><section class="panel profile"><div class="profileHead">${profile.avatar?`<img class="avatar big" src="${profile.avatar}">`:`<div class="avatar big">${esc(profile.name||'Y')[0]||'Y'}</div>`}<div><b>My Profile</b><span>Your information for companions</span></div></div><label class="upload">＋ Change profile picture<input type="file" accept="image/*" onchange="fileData(this,x=>{profile.avatar=x;save(P,profile);settings()})"></label><div class="form"><label>Your name<input value="${esc(profile.name)}" oninput="profile.name=this.value;save(P,profile)"></label><label>About you<textarea oninput="profile.bio=this.value;save(P,profile)" placeholder="Your personality, appearance, preferences, background, and anything you want your characters to know...">${esc(profile.bio)}</textarea></label></div></section><div class="setting"><span>♡</span><div><b>Relationship system</b>Affectionate nicknames are selected naturally from context, mood, and relationship development.</div></div><div class="setting"><span>🧠</span><div><b>Character memory</b>Each character has its own separate memory and conversation history.</div></div><div class="setting"><span>◈</span><div><b>Conversation behavior</b>Veya does not add unnecessary extra blocking; underlying AI provider safety rules may still apply.</div></div></main>${nav()}`}
render();
</script></body></html>
